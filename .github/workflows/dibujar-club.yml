# Dibujante de Inmoescala Club: Work lo lanza con una pieza y el runner saca las PNG de cada slide e historia y el
# video de portada (dibujar-club.mjs). Habla con Work con el secreto CAPTURER_SECRET.
name: Dibujante Inmoescala Club

on:
  workflow_dispatch:
    inputs:
      piece_id:
        description: "Pieza de Inmoescala Club (la crea Work)"
        required: true

permissions:
  contents: read

concurrency:
  group: dibujar-${{ inputs.piece_id }}

jobs:
  dibujar:
    runs-on: ubuntu-24.04  # Playwright 1.52 no corre en Ubuntu 26 (el nuevo ubuntu-latest)
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navegador en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.52.0
      - name: ffmpeg y recorte en caché (rembg y su modelo se instalan solo si una portada lo pide)
        uses: actions/cache@v4
        with:
          path: |
            ~/ffmpeg
            ~/.u2net
            ~/.local/share/pipx
            ~/.local/bin
          key: herramientas-2
      # Sin apt (2026-10-25: «--with-deps» y apt-get se colgaron 15 min reiniciando servicios). El runner ya trae las
      # librerías del navegador; ffmpeg es un binario estático que queda en caché.
      - name: Instalar Playwright y ffmpeg (sin apt)
        timeout-minutes: 5
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
          if ! command -v ffmpeg >/dev/null; then
            if [ ! -x "$HOME/ffmpeg/ffmpeg" ]; then
              mkdir -p "$HOME/ffmpeg"
              curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            fi
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          fi
      - name: Dibujar
        timeout-minutes: 8
        env:
          WORK_URL: https://work.inmoescala.com
          CAPTURER_SECRET: ${{ secrets.CAPTURER_SECRET }}
          PIECE_ID: ${{ inputs.piece_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node dibujar-club.mjs
